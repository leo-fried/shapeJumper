name: Build shapeJumper (Linux only)

on:
  push:
    tags:
      - "v*"  # Only build on version tags
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses-dev libsfml-dev

    - name: Build
      run: |
        make -C src shapeJumper

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: shapeJumper-Linux
        path: src/shapeJumper

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
